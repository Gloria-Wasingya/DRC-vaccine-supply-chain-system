{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Edit Inventory Batch</h1>
        <p>Update an existing vaccine batch record.</p>
    </div>
</div>

<div class="card form-panel">
    <form method="post" action="{{ url_for('hospital_inventory_edit', inventory_id=item._id) }}" class="styled-form grid-form">
        <label>Vaccine Name
            <select name="vaccine_id" required>
                {% for vaccine in vaccines %}
                <option value="{{ vaccine._id }}" {% if vaccine._id|string == item.vaccine_id|string %}selected{% endif %}>{{ vaccine.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Manufacturer<input type="text" name="manufacturer" value="{{ item.manufacturer or '' }}"></label>
        <label>Donor / Supplier<input type="text" name="supplier" value="{{ item.supplier or '' }}"></label>
        <label>Batch Number<input type="text" name="batch_number" value="{{ item.batch_number }}" required></label>
        <label>Available Quantity<input type="number" name="quantity_available" min="0" value="{{ item.quantity_available }}" required></label>
        <label>Minimum Stock Level<input type="number" name="minimum_stock" min="0" value="{{ item.minimum_stock }}"></label>
        <label>Expiry Date<input type="date" name="expiry_date" value="{{ item.expiry_date or '' }}"></label>
        <div class="form-actions full-width">
            <button type="submit" class="primary-btn">Update Batch</button>
            <a href="{{ url_for('hospital_inventory') }}" class="secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
