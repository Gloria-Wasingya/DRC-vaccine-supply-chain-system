{% extends 'base.html' %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-mark large">
                <img src="{{ url_for('static', filename='images/drc-health-logo.png') }}" alt="DRC Ministry of Health">
            </div>
            <h1>DRC Vaccine supply chain</h1>
            <p>Secure access for Ministry administrators and hospital staff.</p>
        </div>

        <form method="post" action="{{ url_for('login') }}" class="styled-form">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="primary-btn">Login</button>
        </form>

        <div class="auth-actions">
            <p>New facility?</p>
            <a href="{{ url_for('register_facility') }}" class="secondary-link">Register here</a>
        </div>

        <div class="demo-box">
            <p><strong>Demo Admin</strong>: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
